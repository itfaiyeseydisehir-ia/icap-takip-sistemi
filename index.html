<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seydişehir İtfaiyesi - İcap Takip</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">  
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{--kirmizi:#9c2b2b;--kirmizi-koyu:#6f1d1d;--yesil:#2f7a52;--yesil-acik:#eef6f1;--mavi:#35618a;--mavi-acik:#eef3f7;--turuncu:#b5721f;--turuncu-acik:#faf3e8;--mor:#6a5590;--mor-acik:#f1eef6;--arka:#f4f5f6;--kart:#fff;--kenar:#e4e6e9;--metin:#23262b;--ikincil:#6b7178;--soluk:#979da3;--golge:0 2px 10px rgba(20,22,26,.05)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;min-height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#f7f8fa 0%,#eef1f4 100%);color:var(--metin);-webkit-font-smoothing:antialiased}
  button,input,textarea,select{font-family:inherit}button{-webkit-appearance:none;border:none;cursor:pointer}
  .ekran{display:none}.ekran.aktif{display:block}.ekran-orta{display:none;min-height:100vh;align-items:center;justify-content:center;padding:18px}.ekran-orta.aktif{display:flex}
  .giris-kart{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:400px;box-shadow:0 10px 28px rgba(20,22,26,.14)}
  .giris-logo{background:linear-gradient(135deg,var(--kirmizi-koyu),var(--kirmizi));border-radius:16px;padding:18px;text-align:center;color:#fff;margin-bottom:18px}
  .giris-logo h1{font-size:17px;margin:0 0 4px}.giris-logo p{font-size:12px;opacity:.85;margin:0}
  .form-grup{margin-bottom:14px}.form-grup label{display:block;font-size:12px;font-weight:700;color:#30363d;margin-bottom:6px}
  .form-grup input,.form-grup select{width:100%;padding:12px 14px;border:1px solid #d7dde2;background:#fafbfc;border-radius:10px;font-size:14px;color:#22282e;outline:none}
  .form-grup input:focus{border-color:var(--kirmizi);background:#fff}
  .btn{width:100%;padding:13px;border-radius:10px;font-size:14px;font-weight:800;transition:.15s;margin-bottom:8px}
  .btn-primary{background:linear-gradient(135deg,var(--yesil),#245f42);color:#fff}
  .btn-kirmizi{background:var(--kirmizi);color:#fff}.btn-mor{background:var(--mor);color:#fff}.btn-mavi{background:var(--mavi);color:#fff}
  .btn-link{background:none;color:var(--kirmizi);font-weight:700;font-size:13px;padding:8px 0;text-decoration:underline;width:100%}
  .hata-metin{color:#a33a3a;font-size:12px;text-align:center;margin-top:10px;min-height:16px;font-weight:600}
  .ust-bar{background:linear-gradient(135deg,var(--kirmizi-koyu),var(--kirmizi));color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .ust-bar-sol{display:flex;align-items:center;gap:10px}.ust-bar-baslik{font-size:14px;font-weight:800}.ust-bar-alt{font-size:11px;opacity:.82}
  .ust-bar-sag{display:flex;align-items:center;gap:10px}.kullanici-bilgi{font-size:12px;text-align:right}.kullanici-bilgi strong{display:block;font-size:12px}.kullanici-bilgi span{font-size:10px;opacity:.82}
  .cikis-btn{background:rgba(255,255,255,.15);color:#fff;padding:8px 12px;border-radius:9px;font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,.25)}
  .ana-icerik{padding:14px;max-width:760px;margin:0 auto}
  .kart{background:var(--kart);border:1px solid var(--kenar);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--golge)}
  .kart-baslik{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:#242a30;margin-bottom:13px}
  .kart-baslik-simge{width:30px;height:30px;border-radius:9px;background:#f1f3f5;display:flex;align-items:center;justify-content:center;font-size:15px}
  .stat-buyuk{background:linear-gradient(135deg,#2f7a52,#245f42);color:#fff;border-radius:18px;padding:22px 18px;text-align:center;margin-bottom:14px}
  .stat-rakam{font-size:56px;font-weight:900;line-height:1}.stat-etiket{font-size:12px;opacity:.92;margin-top:6px;font-weight:700;text-transform:uppercase}
  .bakiye-kart{background:linear-gradient(135deg,#eef3f7,#e3ecf2);border:1px solid #c9dbe7;border-radius:16px;padding:16px;margin-bottom:14px}
  .bakiye-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .bakiye-item{background:#fff;border-radius:10px;padding:11px 8px;text-align:center;border:1px solid #dfe8f0}
  .bakiye-etiket{font-size:9.5px;font-weight:800;color:#6a7a89;text-transform:uppercase}.bakiye-deger{font-size:15px;font-weight:900;color:#1f3a52}
  .aktif-item{background:#f8fafb;border:1px solid #e0e5e9;border-left:4px solid var(--mavi);border-radius:11px;padding:11px 12px;margin-bottom:8px}
  .aktif-ust{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.aktif-isim{font-size:14px;font-weight:800}
  .onay-item{background:#fffaf5;border:1px solid #f1dfca;border-left:4px solid var(--turuncu);border-radius:11px;padding:12px;margin-bottom:10px}
  .onay-btnler{display:flex;gap:8px;margin-top:10px}.onay-btnler button{flex:1;padding:10px;border-radius:9px;font-size:12px;font-weight:800}
  .btn-success{background:var(--yesil);color:#fff}.btn-danger{background:#b33b3b;color:#fff}
  textarea{width:100%;min-height:70px;border-radius:10px;border:1px solid #d7dde2;padding:11px;font-size:13px;margin-bottom:10px}
  .modal{display:none;position:fixed;inset:0;background:rgba(25,30,35,.7);z-index:1000;align-items:center;justify-content:center;padding:14px}
  .modal.aktif{display:flex}.modal-content{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:450px;max-height:85vh;overflow-y:auto}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:10px;opacity:0;transition:.3s;z-index:9999}
  #toast.gorunur{opacity:1}
  @media(max-width:480px){.stat-rakam{font-size:48px}.bakiye-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="toast"></div>

<div id="ekranGiris" class="ekran-orta aktif">
  <div class="giris-kart">
    <div class="giris-logo"><h1>🔥 Seydişehir İtfaiyesi</h1><p>İcap Takip Sistemi</p></div>
    <form id="girisForm">
      <div class="form-grup"><label>E-posta</label><input id="girisEmail" type="email" required></div>
      <div class="form-grup"><label>Şifre (6 Haneli PIN)</label><input id="girisSifre" type="password" maxlength="6" required inputmode="numeric" pattern="\d*"></div>
      <button type="submit" class="btn btn-primary">Giriş Yap</button>
      <div id="girisHata" class="hata-metin"></div>
    </form>
    <button type="button" class="btn-link" onclick="ekranDegistir('ekranKayit')">İlk Kez Kayıt Ol / Şifre Sıfırla</button>
  </div>
</div>

<div id="ekranKayit" class="ekran-orta">
  <div class="giris-kart">
    <div class="giris-logo"><h1>📝 Sisteme Kayıt</h1><p>Sadece önceden tanımlanmış e-postalar</p></div>
    <form id="kayitForm">
      <div class="form-grup"><label>E-posta (Kurum E-postanız)</label><input id="kayitEmail" type="email" required></div>
      <div class="form-grup"><label>6 Haneli Şifre (PIN) Belirleyin</label><input id="kayitSifre" type="password" maxlength="6" required inputmode="numeric" pattern="\d*"></div>
      <button type="submit" class="btn btn-primary">Kayıt Ol</button>
      <div id="kayitHata" class="hata-metin"></div>
    </form>
    <button type="button" class="btn-link" onclick="ekranDegistir('ekranGiris')">Geri Dön</button>
  </div>
</div>

<div id="ekranUygulama" class="ekran">
  <div class="ust-bar">
    <div class="ust-bar-sol"><div><div class="ust-bar-baslik">🔥 İcap Takip</div><div class="ust-bar-alt" id="ustVardiya"></div></div></div>
    <div class="ust-bar-sag">
      <div class="kullanici-bilgi"><strong id="ustIsim"></strong><span id="ustRol"></span></div>
      <button type="button" class="cikis-btn" onclick="cikisYap()">Çıkış</button>
    </div>
  </div>
  <div class="ana-icerik">
  
  <!-- 1. AKTİF İCAP SAYISI -->
  <div class="stat-buyuk">
    <div class="stat-rakam" id="aktifIcapSayisi">0</div>
    <div class="stat-etiket">Aktif İcap Personeli</div>
  </div>

  <!-- 2. ŞU AN GÖREVDE OLANLAR -->
  <div class="kart">
    <div class="kart-baslik">
      <div class="kart-baslik-simge">🟢</div>Şu An Görevde Olanlar
    </div>
    <div id="aktifIcapListe"></div>
  </div>

  <!-- 3. DİĞER ALANLAR -->
  <div id="hazirIcapcilarKart"></div>
  <div id="kisiselBakiyeKart"></div>
  <div id="rolIcerik"></div>

  <!-- 4. YEDEKLEME BUTONU -->
  <div class="kart" style="text-align:center; background:#f8fafb;">
    <button type="button" class="btn btn-outline" onclick="veriYedekle()" style="border:1px dashed #9c2b2b; color:#9c2b2b; font-weight:bold; padding:12px;">
      📥 Sistemi Yedekle ve E-posta Gönder
    </button>
  </div>

  <!-- 5. LOG PENCERESİ -->
  <div id="logPenceresi" class="kart" style="margin-top:20px; background:#f8fafb; border:1px dashed #ccc; box-shadow:none; display:none;"></div>

</div>

<!-- JavaScript dosyamızı buraya çağırıyoruz -->
<script src="app.js"></script>
</body>
</html>
